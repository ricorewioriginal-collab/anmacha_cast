name: Deploy AnMaCha Cast Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'docs/openapi.json'
      - 'studio/api-docs.html'
      - 'studio/mobil.*'
      - 'studio/sw.js'
      - 'studio/js/**'
      - 'packaging/fdroid/**'
      - 'scripts/build-fdroid-repo.sh'
      - '.github/workflows/pages.yml'
  # Nach jedem erfolgreichen Build auf main: F-Droid-Repository mit der neuesten signierten APK aktualisieren
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: API-Dokumentation einbinden
        run: |
          cp docs/openapi.json site/openapi.json
          sed "s#const STATIC_DOCS = false;#const STATIC_DOCS = true;#" studio/api-docs.html > site/api.html
          grep -q "STATIC_DOCS = true" site/api.html

      - name: Mobil-Web-App einbinden (app/)
        run: |
          mkdir -p site/app/js site/app/icons
          cp studio/mobil.html studio/mobil.css studio/mobil.webmanifest studio/sw.js site/app/
          cp studio/js/mobil.js studio/js/api.js studio/js/legacy-storage.js studio/js/ui.js studio/js/pwa.js studio/js/audio.js site/app/js/
          cp studio/icons/icon-32.png studio/icons/icon-180.png studio/icons/icon-192.png studio/icons/icon-512.png studio/icons/wordmark.png site/app/icons/
          cp studio/mobil.html site/app/index.html
          test -f site/app/mobil.html && test -f site/app/index.html

      # Eigenes F-Droid-Repository (fdroid/): nur mit der offiziell signierten APK aus dem neuesten Release.
      # Ohne Schlüssel-Secrets oder bei Debug-/fremder Signatur wird es übersprungen, damit Clients keine
      # APK mit wechselnder Signatur sehen. Die Seite wird in jedem Fall veröffentlicht.
      - name: F-Droid-Repository erzeugen (fdroid/)
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          skip() { echo "::warning::F-Droid-Repository übersprungen: $1"; exit 0; }
          [ -n "$KEYSTORE_B64" ] || skip "Android-Signatur-Secrets fehlen."
          gh release download --repo "$GITHUB_REPOSITORY" --pattern AnMaCha-Cast-Android.apk --dir "$RUNNER_TEMP" --clobber || skip "keine APK im neuesten Release."
          export ANDROID_KEYSTORE="$RUNNER_TEMP/anmachacast.jks" ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
          echo "$KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          APK_FPR="$("$APKSIGNER" verify --print-certs "$RUNNER_TEMP/AnMaCha-Cast-Android.apk" | awk -F': ' '/certificate SHA-256 digest/{print $2; exit}')"
          KEY_FPR="$(keytool -list -v -keystore "$ANDROID_KEYSTORE" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')"
          [ -n "$APK_FPR" ] && [ "$APK_FPR" = "$KEY_FPR" ] || skip "die APK im Release ist nicht mit dem hinterlegten Schlüssel signiert."
          python3 -m venv "$RUNNER_TEMP/fdroid-venv"
          "$RUNNER_TEMP/fdroid-venv/bin/pip" install -q fdroidserver==2.4.2 androguard==4.1.3
          PATH="$RUNNER_TEMP/fdroid-venv/bin:$PATH" bash scripts/build-fdroid-repo.sh "$RUNNER_TEMP/AnMaCha-Cast-Android.apk" site/fdroid
          rm -f "$ANDROID_KEYSTORE"

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
