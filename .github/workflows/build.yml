name: Build

on:
  push:
    branches: ['main']
    tags: ['v*']
    paths-ignore:
      - 'docs/screenshots/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pro Branch darf nur der neueste Build Ressourcen verbrauchen. Bei mehreren schnellen Commits
# werden aeltere queued/running Runs automatisch abgebrochen statt parallel weiterzubauen.
concurrency:
  group: anmachacast-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# docker/build-push-action legt sonst pro Build ein zusaetzliches .dockerbuild-Record-Artefakt an.
# Fuer AnMaCha Cast reichen Logs und normale Build-Artefakte; das spart Actions-Speicher.
env:
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  test:
    # Generierte Automations-PRs brauchen keinen kompletten Plattform-Build.
    if: github.event_name != 'pull_request' || (!startsWith(github.head_ref, 'automation/release-badge-') && !startsWith(github.head_ref, 'automation/changelog-') && !startsWith(github.head_ref, 'automation/screenshots-'))
    runs-on: ubuntu-latest
    # hängende Tests (z. B. offene Datenbankverbindungen) nicht stundenlang laufen lassen
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-pw
          MYSQL_DATABASE: anmachacast_test
          MYSQL_USER: anmachacast
          MYSQL_PASSWORD: anmachacast-pw
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-pw"
          --health-interval=5s --health-timeout=5s --health-retries=20
      # Datenbankschicht: dieselben Tests gegen SQLite, PostgreSQL, MariaDB und MySQL (DATABASE.md „Tests“)
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: anmachacast
          POSTGRES_PASSWORD: anmachacast-pw
          POSTGRES_DB: anmachacast_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U anmachacast" --health-interval=5s --health-timeout=5s --health-retries=20
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root-pw
          MARIADB_DATABASE: anmachacast_test
          MARIADB_USER: anmachacast
          MARIADB_PASSWORD: anmachacast-pw
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      ANMACHA_CAST_TEST_MYSQL: 127.0.0.1:3306:anmachacast:anmachacast-pw:anmachacast_test
      ANMACHA_CAST_TEST_PG: postgres://anmachacast:anmachacast-pw@127.0.0.1:5432/anmachacast_test
      ANMACHA_CAST_TEST_MYSQL_URL: mysql://anmachacast:anmachacast-pw@127.0.0.1:3306/anmachacast_test
      ANMACHA_CAST_TEST_MARIADB_URL: mysql://anmachacast:anmachacast-pw@127.0.0.1:3307/anmachacast_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - name: ffmpeg (für Playout-Integrationstest)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run check
      # Windows-Programm schon hier prüfen (schnell, ohne Windows-Rechner): Logik-Tests und Übersetzung gegen .NET Framework 4.8
      - name: Windows-Programm - Logik-Tests und Übersetzungsprüfung
        run: |
          dotnet test apps/windows/tests/WindowsLogic.Tests.csproj -v q
          dotnet build apps/windows/check/Check.csproj -c Release -v q

  windows:
    needs: [test, android]
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX_B64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: AnMaCha Cast bauen (Engine als Node Single Executable + Windows-Programm)
        run: node scripts/build.mjs --sea
      - name: Programme signieren (nur mit hinterlegtem Zertifikat)
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP/cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match 'x64' } | Select-Object -Last 1
          foreach ($f in @('dist/AnMaChaCast/AnMaChaCast.exe', 'dist/AnMaChaCast/anmachacast-engine.exe')) {
            & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "AnMaCha Cast" $f
            if ($LASTEXITCODE -ne 0) { throw "Signieren fehlgeschlagen: $f" }
          }
          Remove-Item $pfx
      - name: Android-App beilegen (Download direkt aus AnMaCha Cast)
        uses: actions/download-artifact@v4
        with: { name: AnMaCha-Cast-Android, path: dist/AnMaChaCast/android }
      - name: ffmpeg beilegen
        shell: pwsh
        run: |
          $dest = "dist/AnMaChaCast/ffmpeg"
          foreach ($variant in @('lgpl', 'gpl')) {
            $zip = "$env:RUNNER_TEMP/ffmpeg-$variant.zip"
            Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-$variant.zip" -OutFile $zip
            Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP/ff-$variant" -Force
            $bin = Get-ChildItem "$env:RUNNER_TEMP/ff-$variant" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
            $enc = & $bin.FullName -hide_banner -encoders
            if (($enc | Select-String 'libmp3lame') -and ($enc | Select-String 'libopus')) {
              Copy-Item $bin.FullName, (Join-Path $bin.DirectoryName 'ffprobe.exe'), (Join-Path $bin.DirectoryName 'ffplay.exe') $dest
              Get-ChildItem (Split-Path $bin.DirectoryName) -Filter 'LICENSE*' | Copy-Item -Destination $dest
              "ffmpeg-Build: BtbN/FFmpeg-Builds ($variant), https://github.com/BtbN/FFmpeg-Builds" | Out-File "$dest/QUELLE.txt"
              Write-Host "ffmpeg ($variant) beigelegt"
              exit 0
            }
          }
          throw 'Kein ffmpeg-Build mit libmp3lame + libopus gefunden'
      - name: Smoke-Test
        shell: pwsh
        run: |
          $env:ANMACHA_CAST_DATA = "$env:RUNNER_TEMP/anmachacast-data"
          $env:ANMACHA_CAST_PORT = '8753'
          $engine = 'dist/AnMaChaCast/anmachacast-engine.exe'
          if (-not (Test-Path dist/AnMaChaCast/AnMaChaCast.exe)) { throw 'Windows-Programm AnMaChaCast.exe fehlt' }
          # Engine ohne Konsole: Ausgabe über Umleitung prüfen
          Start-Process -FilePath $engine -ArgumentList '--new-admin-token' -Wait -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP/out.txt"
          $out = Get-Content "$env:RUNNER_TEMP/out.txt"
          $out
          if (-not ($out | Select-String 'ffmpeg version')) { throw 'ffmpeg wurde nicht erkannt' }
          if (-not (Test-Path "$env:ANMACHA_CAST_DATA/logs/anmachacast.log")) { throw 'Logdatei fehlt' }
          $p = Start-Process -FilePath $engine -ArgumentList '--headless', '--no-tray' -PassThru
          Start-Sleep -Seconds 5
          $r = Invoke-RestMethod http://127.0.0.1:8753/api/v1/health
          # Studio-Oberfläche muss wirklich ausgeliefert werden (nicht nur die API)
          $page = Invoke-WebRequest http://127.0.0.1:8753/ -UseBasicParsing
          $js = Invoke-WebRequest http://127.0.0.1:8753/js/app.js -UseBasicParsing
          # Adresse für das Programmfenster (Zugang dieses PCs, Engine läuft)
          Start-Process -FilePath $engine -ArgumentList '--print-url' -Wait -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP/url.txt"
          $info = Get-Content "$env:RUNNER_TEMP/url.txt" -Raw | ConvertFrom-Json
          if (-not $info.running -or -not ($info.url -match '^http://127\.0\.0\.1:8753/#token=ad_')) { throw "print-url liefert nichts Brauchbares: $($info.url -replace 'token=.*','token=…')" }
          # sauber beenden wie über das Tray-Symbol
          Start-Process -FilePath $engine -ArgumentList '--stop' -Wait -NoNewWindow
          $p.WaitForExit(8000) | Out-Null
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force; throw 'AnMaChaCast --stop hat die Instanz nicht beendet' }
          if (-not $r.ok) { throw 'Health-Check fehlgeschlagen' }
          if ($page.StatusCode -ne 200 -or -not ($page.Content -match 'AnMaCha Cast')) { throw 'Studio-Startseite wird nicht ausgeliefert' }
          if ($js.StatusCode -ne 200) { throw 'Studio-Skripte werden nicht ausgeliefert' }
          Write-Host 'Engine startet und antwortet.'
          # Windows-Programm: startet die Engine selbst (nur Infobereich, ohne Fenster)
          $env:ANMACHA_CAST_PORT = '8756'
          $w = Start-Process -FilePath dist/AnMaChaCast/AnMaChaCast.exe -ArgumentList '--minimized' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) { Start-Sleep -Seconds 1; try { $ok = (Invoke-RestMethod http://127.0.0.1:8756/api/v1/health).ok } catch {} }
          Start-Process -FilePath $engine -ArgumentList '--stop' -Wait -NoNewWindow
          if (-not $w.HasExited) { Stop-Process -Id $w.Id -Force }
          if (-not $ok) { throw 'AnMaChaCast.exe hat die Engine nicht gestartet' }
          Write-Host 'AnMaChaCast.exe startet die Engine.'
      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
            $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $found) { choco install innosetup -y --no-progress | Out-Null; $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1 }
            $iscc = $found
          } else { $iscc = $iscc.Source }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          & $iscc "/DAppVersion=$version" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup fehlgeschlagen' }
          Get-ChildItem dist/AnMaCha-Cast-Setup-*.exe
      - name: Installer signieren (nur mit hinterlegtem Zertifikat)
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP/cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match 'x64' } | Select-Object -Last 1
          foreach ($f in @((Get-ChildItem dist/AnMaCha-Cast-Setup-*.exe).FullName)) {
            & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "AnMaCha Cast" $f
            if ($LASTEXITCODE -ne 0) { throw "Signieren fehlgeschlagen: $f" }
          }
          Remove-Item $pfx
      - name: Installer-Test (still installieren, starten, deinstallieren)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/AnMaCha-Cast-Setup-*.exe | Select-Object -First 1
          $install = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/SP-', '/TASKS=""' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer fehlgeschlagen: $($install.ExitCode)" }
          if (Test-Path "$env:LOCALAPPDATA/AnMaChaCast/data/installer-bootstrap.json") { throw 'Silent-Setup darf keine leeren Admin-Zugangsdaten anlegen' }
          if (-not (Test-Path "$env:LOCALAPPDATA/Programs/AnMaChaCast/AnMaChaCast.exe")) { throw 'AnMaChaCast.exe nach Installation nicht gefunden' }
          $exe = "$env:LOCALAPPDATA/Programs/AnMaChaCast/anmachacast-engine.exe"
          if (-not (Test-Path $exe)) { throw 'anmachacast-engine.exe nach Installation nicht gefunden' }
          $env:ANMACHA_CAST_DATA = "$env:RUNNER_TEMP/anmachacast-inst"
          $env:ANMACHA_CAST_PORT = '8755'
          $p = Start-Process $exe -ArgumentList '--headless', '--no-tray' -PassThru
          Start-Sleep -Seconds 5
          $r = Invoke-RestMethod http://127.0.0.1:8755/api/v1/health
          $page = Invoke-WebRequest http://127.0.0.1:8755/ -UseBasicParsing
          Stop-Process -Id $p.Id -Force
          if (-not $r.ok) { throw 'Installierte Version antwortet nicht' }
          if ($page.StatusCode -ne 200) { throw 'Installierte Version liefert das Studio nicht aus' }
          $uninstall = Start-Process "$env:LOCALAPPDATA/Programs/AnMaChaCast/unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Deinstallation fehlgeschlagen: $($uninstall.ExitCode)" }
          if (Test-Path $exe) { throw 'Engine nach Deinstallation noch vorhanden' }
          Write-Host 'Installer: Installation, Start und Deinstallation OK'
      - uses: actions/upload-artifact@v4
        with:
          name: AnMaCha-Cast-Windows-Installer
          path: dist/AnMaCha-Cast-Setup-*.exe
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: AnMaCha-Cast-Windows
          path: dist/AnMaChaCast
          retention-days: 1

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Image bauen
        run: docker build -t anmachacast:ci .
      - name: Container starten und prüfen
        run: |
          docker run -d --name anmachacast -p 8750:8750 anmachacast:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8750/api/v1/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8750/api/v1/health
          curl -fs http://127.0.0.1:8750/ | grep -q "AnMaCha Cast"
          docker logs anmachacast | tee log.txt
          grep -q "ffmpeg version" log.txt || (echo "ffmpeg fehlt im Container" && exit 1)
          grep -q "Admin-Token" log.txt || (echo "Admin-Token wird nicht ausgegeben" && exit 1)
          # Liquidsoap-Skript aus der laufenden Instanz erzeugen und mit echtem Liquidsoap prüfen
          TOKEN=$(grep -A1 "Admin-Token" log.txt | tail -1 | tr -d ' \r')
          curl -fs -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"name":"Test","type":"icecast","host":"127.0.0.1","port":8000,"mount":"/stream","username":"source","password":"x-geheim-1","priority":5}' \
            http://127.0.0.1:8750/api/v1/stations/main/outputs > /dev/null
          curl -fs -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8750/api/v1/stations/main/liquidsoap -o anmachacast.liq
          cat anmachacast.liq
          ! grep -q "x-geheim-1" anmachacast.liq || (echo "Passwort im Skript!" && exit 1)
          docker run --rm -v "$PWD:/s" --entrypoint liquidsoap savonet/liquidsoap:v2.2.5 --check /s/anmachacast.liq
          docker stop -t 10 anmachacast
          test "$(docker inspect -f '{{.State.ExitCode}}' anmachacast)" = "0" || (echo "Container wurde nicht sauber beendet" && exit 1)
      - name: docker compose mit PostgreSQL
        run: |
          docker rm -f anmachacast > /dev/null
          docker compose up -d
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8750/api/v1/health && break; sleep 1; done
          docker compose logs anmachacast | tee log.txt
          grep -q "Datenbank: postgres" log.txt || (echo "PostgreSQL wird nicht genutzt" && exit 1)
          # compose setzt „anmachacast  | “ vor jede Zeile – Token direkt am Muster erkennen
          TOKEN=$(grep -A1 "Admin-Token" log.txt | grep -o 'ad_[A-Za-z0-9_-]*' | head -1)
          test -n "$TOKEN" || (echo "Admin-Token nicht gefunden" && exit 1)
          curl -fs -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"id":"ci","name":"CI Radio"}' http://127.0.0.1:8750/api/v1/stations > /dev/null
          # Neustart: Daten müssen aus PostgreSQL kommen
          docker compose restart anmachacast
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8750/api/v1/health > /dev/null && break; sleep 1; done
          curl -fs -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8750/api/v1/stations | grep -q '"id":"ci"' || (echo "Sender nach Neustart verloren" && exit 1)
          curl -fs -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8750/api/v1/database | tee db.json | grep -q '"engine":"PostgreSQL"'
          docker compose down

  demo:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Demo-Image bauen und Vollfunktions-Reset pruefen
        run: |
          set -e
          docker compose -f packaging/demo/docker-compose.demo.yml build
          sh packaging/demo/reset-demo.sh
          curl -fs http://127.0.0.1:8751/api/v1/health | grep -q '"ok":true'

          LOGIN=$(curl -fs -X POST -H 'Content-Type: application/json'             -d '{"username":"demo","password":"anmachacast-demo"}'             http://127.0.0.1:8751/api/v1/auth/login)
          TOKEN=$(printf '%s' "$LOGIN" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).token||''))")
          test -n "$TOKEN" || (echo "Demo-Login fehlgeschlagen" && exit 1)

          WALL=$(curl -fs -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8751/api/v1/stations/main/cardwall)
          printf '%s' "$WALL" | grep -q 'Demo Jingle' || (echo "Demo-Cardwall ist leer" && exit 1)
          printf '%s' "$WALL" | grep -q 'AnMaCha-Cast-FM ID' || (echo "Demo-Station-ID fehlt im Cardwall" && exit 1)

          curl -fs -X POST -H "Authorization: Bearer $TOKEN"             http://127.0.0.1:8751/api/v1/stations/main/cardwall/cart1/trigger > /dev/null
          sleep 2
          curl -fs -H "Authorization: Bearer $TOKEN"             http://127.0.0.1:8751/api/v1/stations/main/playout | grep -q '"running":true'             || (echo "Demo-Playout/Cardwall startet nicht" && exit 1)

          docker compose -f packaging/demo/docker-compose.demo.yml logs anmachacast-demo
          docker compose -f packaging/demo/docker-compose.demo.yml down -v
          echo "Demo: Login, Cardwall, Playout und Reset OK"

  # Spart Rechenzeit: Browser-Test und Screenshots laufen nur, wenn sich dafür relevante Dateien geändert haben
  # (Oberfläche, Demo, Screenshot-Skripte bzw. für den Browser-Test auch der Server). Manueller Start: immer.
  changes:
    if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      smoke: ${{ steps.f.outputs.smoke }}
      shots: ${{ steps.f.outputs.shots }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 2 }
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            FILES=$(git ls-files)
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "${BEFORE#0000000}" != "$BEFORE" ]; then
            FILES=$(git ls-files)   # neuer Branch: alles prüfen
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && git fetch -q --no-tags --depth=1 origin "$BEFORE" 2>/dev/null; then
            FILES=$(git diff --name-only "$BEFORE" HEAD)
          else
            # Pull Request (Merge-Commit auf dem Zielzweig) bzw. einzelner Commit: Unterschied zum ersten Elternteil
            FILES=$(git diff --name-only HEAD^1 HEAD 2>/dev/null || git ls-files)
          fi
          echo "Geänderte Dateien:"; echo "$FILES" | head -50
          shots=false; smoke=false
          echo "$FILES" | grep -Eq '^(studio/|scripts/screenshots\.mjs|packaging/demo/)' && shots=true
          { [ "$shots" = true ] || echo "$FILES" | grep -Eq '^(src/|scripts/browser-smoke\.mjs|package(-lock)?\.json|\.github/workflows/build\.yml)'; } && smoke=true
          echo "shots=$shots" >> "$GITHUB_OUTPUT"
          echo "smoke=$smoke" >> "$GITHUB_OUTPUT"
          echo "Browser-Test: $smoke · Screenshots: $shots"

  screenshots:
    if: needs.changes.outputs.smoke == 'true' && (github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch) && !contains(github.event.head_commit.message, '[screenshots]')
    needs: [demo, changes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Browser installieren
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Bildwerkzeuge installieren (nur für neue Screenshots)
        if: needs.changes.outputs.shots == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
      - name: Demo fuer aktuelle Screenshots starten
        run: |
          docker compose -f packaging/demo/docker-compose.demo.yml build
          sh packaging/demo/reset-demo.sh
          # Fuer die Dokumentationsbilder wird nur innerhalb des isolierten CI-Containers der
          # globale Bootstrap-Token benutzt, damit auch Admin-Ansichten fotografiert werden koennen.
          # Der oeffentliche Demo-Login bleibt demo / anmachacast-demo und senderbeschraenkt.
          TOKEN=$(docker compose -f packaging/demo/docker-compose.demo.yml logs anmachacast-demo 2>/dev/null | grep -o 'ad_[A-Za-z0-9_-]*' | head -1)
          test -n "$TOKEN"
          echo "ANMACHA_CAST_SCREENSHOT_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Browser-Funktionen gegen echte Demo pruefen
        env:
          ANMACHA_CAST_SCREENSHOT_URL: http://127.0.0.1:8751
        run: node scripts/browser-smoke.mjs
      - name: README-Screenshots neu erzeugen
        if: needs.changes.outputs.shots == 'true'
        env:
          ANMACHA_CAST_SCREENSHOT_URL: http://127.0.0.1:8751
        run: |
          node scripts/screenshots.mjs
          # README-Bilder sind Dokumentation, kein verlustfreies Screenshot-Archiv: Metadaten entfernen
          # und PNG-Kompression maximieren, damit der Git-Verlauf nicht durch UI-Bilder aufblaeht.
          mogrify -strip -define png:compression-level=9 -define png:compression-filter=5 docs/screenshots/*.png
          convert \
            docs/screenshots/view-dashboard.png \
            docs/screenshots/view-studio.png \
            docs/screenshots/view-planning.png \
            docs/screenshots/view-mediathek.png \
            docs/screenshots/view-playlists.png \
            docs/screenshots/view-bridges.png \
            docs/screenshots/view-listeners.png \
            docs/screenshots/view-users.png \
            -resize '820x540>' -gravity center -background '#020817' -extent 820x540 \
            -delay 140 -loop 0 -layers Optimize docs/screenshots/slideshow.gif
          # Harte Repo-Schranke: Ein einzelnes Doku-Bild/GIF soll niemals unbemerkt riesig werden.
          if find docs/screenshots -type f -size +5M | grep -q .; then
            echo "Screenshot groesser als 5 MiB - vor Git-Commit weiter optimieren:"
            find docs/screenshots -type f -size +5M -print
            exit 1
          fi
          du -h docs/screenshots/* | sort -h
      - name: Screenshots nur bei Aenderungen committen
        if: needs.changes.outputs.shots == 'true' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        run: |
          git config user.name "AnMaCha Cast CI"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          REMOTE=$(git rev-parse "origin/$GITHUB_REF_NAME")
          if [ "$REMOTE" != "$GITHUB_SHA" ]; then
            echo "Neuerer Commit $REMOTE vorhanden – dieser alte Lauf darf keine Screenshots zurueckschreiben."
          else
            git add docs/screenshots
            if git diff --cached --quiet; then
              echo "Screenshots bereits aktuell."
            else
              git commit -m "README: aktuelle UI-Screenshots [screenshots]"
              # Direkter Push auf den Hauptbranch kann an einer Repository-Regel ("Changes must be
              # made through a pull request") scheitern. Veraltete Screenshots sind reine Doku und
              # duerfen Build/Deploy nicht blockieren - bei Ablehnung nur warnen, nicht fehlschlagen.
              git push || echo "::warning::Screenshot-Commit konnte nicht gepusht werden (z. B. Repository-Regel) - Build laeuft trotzdem weiter."
            fi
          fi
      - name: Demo aufräumen
        if: always()
        run: docker compose -f packaging/demo/docker-compose.demo.yml down -v

  # docs/DOCKER.md verspricht ausdrücklich "Raspberry Pi 4/5 mit 64 Bit" - bisher baute und testete die
  # CI das Image nur für amd64 (der GitHub-Runner selbst). Per QEMU-Emulation wirklich für arm64 bauen
  # und starten, damit dieses Versprechen nicht nur eine unbelegte Behauptung in der Doku ist.
  docker-arm64:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - uses: docker/setup-buildx-action@v4
      - name: Image für linux/arm64 bauen (emuliert)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: anmachacast:ci-arm64
      - name: Container starten und prüfen (arm64 unter QEMU)
        run: |
          docker run -d --name anmachacast-arm64 --platform linux/arm64 -p 8751:8750 anmachacast:ci-arm64
          # QEMU-Emulation ist deutlich langsamer als natives amd64 - großzügig warten (bis zu 6 Minuten)
          for i in $(seq 1 180); do curl -fs http://127.0.0.1:8751/api/v1/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8751/api/v1/health
          curl -fs http://127.0.0.1:8751/ | grep -q "AnMaCha Cast"
          docker exec anmachacast-arm64 uname -m | grep -q aarch64
          docker logs anmachacast-arm64 | tee log-arm64.txt
          grep -q "ffmpeg version" log-arm64.txt || (echo "ffmpeg fehlt/startet nicht unter arm64" && exit 1)
          grep -q "Admin-Token" log-arm64.txt || (echo "Admin-Token wird nicht ausgegeben" && exit 1)
          docker stop -t 10 anmachacast-arm64
          test "$(docker inspect -f '{{.State.ExitCode}}' anmachacast-arm64)" = "0" || (echo "Container wurde nicht sauber beendet" && exit 1)

  # Linux-Paket: .deb "anmachacast" mit systemd-Dienst „anmachacast-server.service“, Daten unter
  # /var/lib/anmachacast. Läuft auf einem echten ubuntu-latest-Runner (VM mit systemd als PID 1).
  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Debian-Paket bauen
        run: npm run build:linux-deb
      - name: Installieren, Dienst starten, über systemd neu starten, purgen
        run: |
          set -e
          VER=$(node -p "require('./package.json').version")
          sudo apt-get update -q
          # Abhängigkeiten müssen aus dem .deb selbst kommen. --no-install-recommends verhindert,
          # dass ein versehentliches Recommends den fehlenden Encoder kaschiert.
          sudo apt-get install -y -q --no-install-recommends "./dist/anmachacast_${VER}_amd64.deb"
          command -v ffmpeg >/dev/null || (echo "ffmpeg wurde nicht als Paket-Abhängigkeit installiert" && exit 1)
          ffmpeg -version | head -1
          sudo systemctl is-active anmachacast-server.service
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8750/api/v1/health > /dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:8750/api/v1/health | tee health.json
          grep -q '"ok":true' health.json || (echo "Health-Check fehlgeschlagen" && exit 1)
          # journalctl stellt jeder Zeile Zeitstempel/Host/Diensteinheit voran – nur das Token-Muster herausziehen
          TOKEN=$(sudo journalctl -u anmachacast-server --no-pager | grep -o 'ad_[A-Za-z0-9_-]*' | head -1)
          test -n "$TOKEN" || (echo "Admin-Token nicht im Protokoll gefunden" && sudo journalctl -u anmachacast-server --no-pager && exit 1)
          # Neustart über die API (wie Setup-Assistent/Update): AnMaCha Cast erkennt systemd (INVOCATION_ID) und
          # beendet sich mit Exit-Code 75 – RestartForceExitStatus muss den Dienst neu starten (nicht nur beenden).
          PID1=$(sudo systemctl show -p MainPID --value anmachacast-server.service)
          curl -fs -X POST -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8750/api/v1/system/restart > /dev/null \
            || (echo "Neustart-Aufruf abgelehnt (Token: '${TOKEN:0:6}…')" && exit 1)
          PID2=""
          for i in $(seq 1 30); do
            sleep 1
            PID2=$(sudo systemctl show -p MainPID --value anmachacast-server.service)
            [ -n "$PID2" ] && [ "$PID2" != "0" ] && [ "$PID2" != "$PID1" ] && curl -fs http://127.0.0.1:8750/api/v1/health > /dev/null 2>&1 && break
          done
          if [ "$PID2" = "$PID1" ] || [ -z "$PID2" ] || [ "$PID2" = "0" ]; then
            echo "systemd hat den Dienst nach dem Neustart-Aufruf nicht neu gestartet"
            sudo systemctl status anmachacast-server.service --no-pager || true
            exit 1
          fi
          curl -fs http://127.0.0.1:8750/api/v1/health | grep -q '"ok":true'
          echo "Neustart über systemd (Exit-Code 75) OK: PID $PID1 -> $PID2"
          # Entfernen (purge): Programmdateien und Konfiguration weg, Daten (Datenbank, Medien) bleiben.
          # /var/lib/anmachacast gehört dem Dienstkonto „anmachacast“ und ist nur für dieses (und root) lesbar (750) –
          # der Runner-Benutzer selbst darf ohne sudo gar nicht hineinschauen. Genau das war die eigentliche
          # Ursache des bisherigen Fehlschlags: „test -f“ ohne sudo meldete „nicht gefunden“, obwohl die
          # Datenbank die ganze Zeit da war (siehe Diagnose: „Permission denied“ statt einer leeren Liste).
          sudo test -f /var/lib/anmachacast/anmachacast.db || (echo "Diagnose: Datenbank fehlt schon vor dem Stopp/Purge" && sudo ls -la /var/lib/anmachacast && sudo journalctl -u anmachacast-server --no-pager -n 100 && exit 1)
          sudo systemctl stop anmachacast-server.service
          sudo dpkg -P anmachacast
          test ! -e /opt/anmachacast
          test ! -e /etc/anmachacast/anmachacast.conf
          sudo test -f /var/lib/anmachacast/anmachacast.db || (echo "Daten wurden beim Entfernen gelöscht" && sudo ls -la /var/lib/anmachacast && exit 1)
          echo "Linux-Paket: Installation, Dienst, Neustart, Health-Check und Purge OK"
      - uses: actions/upload-artifact@v4
        with:
          name: AnMaCha-Cast-Linux-Deb
          path: dist/anmachacast_*.deb
          retention-days: 1

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - name: Handy-Engine testen (Encoder, Mischpult, Sendung an echten Icecast)
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q icecast2 ffmpeg > /dev/null
          apps/android/engine/test.sh
      - name: APK bauen (natives Gradle-Projekt; offiziell signiert, falls Keystore hinterlegt – sonst Debug)
        working-directory: apps/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p out
          if [ -n "$KEYSTORE_B64" ] && [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/anmachacast.jks"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/anmachacast.jks"
            # Versions-Tag: reine Versionsnummer (z. B. 1.2.3), main: Version-Commit
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export ANDROID_CLEAN_VERSION=1; fi
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk out/AnMaCha-Cast-Android.apk
            # Signatur prüfen: gültig und wirklich vom hinterlegten Schlüssel (nicht Debug)
            APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
            "$APKSIGNER" verify --print-certs out/AnMaCha-Cast-Android.apk | grep -E "certificate SHA-256 digest"
            APK_FPR="$("$APKSIGNER" verify --print-certs out/AnMaCha-Cast-Android.apk | awk '/certificate SHA-256 digest/{print $NF; exit}')"
            KEY_FPR="$(keytool -list -v -keystore "$ANDROID_KEYSTORE" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')"
            [ -n "$APK_FPR" ] && [ "$APK_FPR" = "$KEY_FPR" ] || { echo "::error::APK ist nicht mit dem hinterlegten Release-Schlüssel signiert." >&2; exit 1; }
            echo "Release-APK (offiziell signiert, Zertifikat SHA-256 $APK_FPR)"
            rm -f "$ANDROID_KEYSTORE"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk out/AnMaCha-Cast-Android.apk
            echo "Test-APK mit Debug-Signatur; Release-Signierung erfolgt bei Versionstags mit hinterlegtem Keystore."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: AnMaCha-Cast-Android
          path: apps/android/out/AnMaCha-Cast-Android.apk
          retention-days: 1

  # Download-Bereich: Nach jedem Push auf den Hauptbranch liegen Installer, portable Version und APK
  # unter „Releases → AnMaCha Cast (aktueller Stand)“, ohne GitHub-Login-Umweg über Artefakte.
  release:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref_name == github.event.repository.default_branch)
    needs: [windows, android, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # package.json wird für den Release-Tag gebraucht (Version) - ohne Checkout fehlte die Datei und jeder
      # main-Build endete rot, wodurch auch das Deploy der Demo nie anlief.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      # Nur die eigenen Artefakte laden - "docker-arm64" (docker/build-push-action) legt daneben ein
      # internes Buildx-Cache-Artefakt ab ("<owner>~<repo>~....dockerbuild"), dessen Download
      # gelegentlich fehlschlägt und ohne dieses Muster den ganzen Release-Job unnötig scheitern lässt.
      - uses: actions/download-artifact@v4
        with: { path: artifacts, pattern: 'AnMaCha-Cast-*' }
      - name: Dateien vorbereiten
        run: |
          mkdir -p out
          cp artifacts/AnMaCha-Cast-Windows-Installer/*.exe out/AnMaCha-Cast-Setup.exe
          mv artifacts/AnMaCha-Cast-Windows artifacts/AnMaChaCast && (cd artifacts && zip -qr ../out/AnMaCha-Cast-Windows-Portable.zip AnMaChaCast)
          cp artifacts/AnMaCha-Cast-Android/AnMaCha-Cast-Android.apk out/AnMaCha-Cast-Android.apk
          # stabiler Dateiname für den "latest"-Downloadlink (das Paket selbst heißt "anmachacast")
          cp artifacts/AnMaCha-Cast-Linux-Deb/anmachacast_*.deb out/AnMaCha-Cast-Linux.deb
          ls -la out
      - name: Release-Tag bestimmen (Tag-Push oder Version aus package.json)
        id: rel
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; else tag="v$(jq -r .version package.json)"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" != refs/tags/v* ]] && gh release view "$tag" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      # Release zur Version gibt es schon (jeder main-Push trägt dieselbe Version): Dateien auf den aktuellen Stand
      # bringen statt sie zu überspringen - sonst bleibt das Release ohne Installer/APK/DEB. Schlägt das fehl
      # (z. B. unveränderliches Release), nur warnen: ein roter Build würde auch das Demo-Deploy blockieren.
      - name: Dateien im vorhandenen Release aktualisieren
        if: steps.rel.outputs.exists == 'true'
        continue-on-error: true
        run: |
          if ! gh release upload "${{ steps.rel.outputs.tag }}" out/* --clobber; then
            echo "::warning::Dateien konnten dem vorhandenen Release ${{ steps.rel.outputs.tag }} nicht hinzugefügt werden (unveränderlich?). Neue Version in package.json anlegen oder v*-Tag pushen."
            exit 1
          fi
          gh release edit "${{ steps.rel.outputs.tag }}" --latest --notes "Aktueller Stand von main (${GITHUB_SHA::7}): Windows-Installer und portable Version, Android-APK, Linux-DEB. Server: docker compose up -d (siehe docs/DOCKER.md)." || true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - uses: softprops/action-gh-release@v2
        if: steps.rel.outputs.exists != 'true'
        with:
          # Releases sind im Repository unveränderlich: jeder Build bekommt ein eigenes Release,
          # die Download-Links zeigen über „latest" immer auf das neueste
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AnMaCha Cast ${{ steps.rel.outputs.tag }}
          prerelease: false
          make_latest: true
          body: |
            Gebaut und getestet aus ${{ github.sha }}.
            • AnMaCha-Cast-Setup.exe – Windows-Installer (ohne Adminrechte, Deutsch/English, mit Audio-Engine und Android-APK)
            • AnMaCha-Cast-Windows-Portable.zip – ohne Installation: entpacken und AnMaCha Cast starten
            • AnMaCha-Cast-Android.apk – Android-App: Handy-Sender (Mikrofon + Musik direkt zu laut.fm/Icecast, ohne Server) oder Studio-Fernbedienung für AnMaCha Cast auf PC/Server
            • AnMaCha-Cast-Linux.deb – Linux-Server als systemd-Dienst: `sudo apt install ./AnMaCha-Cast-Linux.deb` (Debian/Ubuntu, x86_64)
            • Server: docker compose up -d (siehe docs/DOCKER.md)

            Powered by AnMaCha Radioproduktion & RicoReWi – für Broadcast, Automation, Live und laut.fm. Hobbyprojekt, ohne Gewähr.
          files: out/*
